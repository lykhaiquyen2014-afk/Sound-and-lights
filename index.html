      // Compatibility patch for environments where window.fetch or Window.prototype.fetch only has a getter
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;

          // 1. Define setter on Window.prototype if needed
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && protoDesc.get && !protoDesc.set) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: protoDesc.get,
                  set: function(fn) {
                    Object.defineProperty(this, 'fetch', {
                      value: fn,
                      writable: true,
                      configurable: true,
                      enumerable: true
                    });
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (_) {}
            }
          }

          // 2. Define getter and setter on window instance
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }

          // 3. Define getter and setter on globalThis if distinct
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch compatibility polyfill:', e);
        }
      })();
